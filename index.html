<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermarker</title>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

    <style>
        :root {
            --bg: #050505; --card: #0f0f0f; --accent: #2952A3;
            --text: #ececec; --border: #262626; --input-bg: #1a1a1a;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 40px 0; box-sizing: border-box;
        }
        .container {
            width: 1300px; max-width: 95vw; display: grid; grid-template-columns: 1fr 450px;
            gap: 24px; background: var(--card); padding: 32px;
            border-radius: 28px; border: 1px solid var(--border);
            align-items: stretch;
        }
        .preview-area {
            background: #000; border-radius: 16px; 
            height: 750px; 
            border: 1px solid var(--border); display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            position: relative; overflow: hidden;
        }
        canvas { max-width: 100%; max-height: 100%; z-index: 1; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .controls { 
            display: flex; flex-direction: column; gap: 10px; 
            height: 750px; overflow-y: auto; padding-right: 15px; 
        }
        .controls::-webkit-scrollbar { width: 6px; }
        .controls::-webkit-scrollbar-track { background: var(--card); border-radius: 10px; }
        .controls::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        .controls::-webkit-scrollbar-thumb:hover { background: #444; }
        
        label { font-size: 0.75rem; color: #888; margin-top: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;}
        input[type="range"], input[type="text"], input[type="color"], input[type="file"], select { 
            background: var(--input-bg); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 8px; width: 100%; box-sizing: border-box;
            font-family: 'Inter', sans-serif; font-size: 0.85rem;
        }
        input[type="color"] { height: 40px; cursor: pointer; padding: 2px;}
        
        .swatch-container { display: flex; gap: 10px; margin-top: 5px; }
        .swatch { width: 35px; height: 35px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .swatch:hover { border-color: white; transform: scale(1.1); }

        .accordion { background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; flex-shrink: 0; }
        .accordion-header { 
            padding: 15px; background: #151515; cursor: pointer; font-weight: bold; 
            display: flex; justify-content: space-between; align-items: center; user-select: none;
        }
        .accordion-header:hover { background: #1a1a1a; }
        .accordion-content { padding: 15px; display: none; flex-direction: column; gap: 10px; border-top: 1px solid var(--border); }
        .accordion.open .accordion-content { display: flex; }
        .accordion-arrow { transition: transform 0.3s; }
        .accordion.open .accordion-arrow { transform: rotate(180deg); }

        .checkbox-container { display: flex; align-items: center; gap: 10px; }
        .checkbox-container label { margin: 0; color: var(--text); cursor: pointer; font-size: 0.8rem; text-transform: none; font-weight: normal;}
        .checkbox-container input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }

        .btn-primary {
            background: #2952A3; border: none; padding: 16px; border-radius: 14px;
            color: white; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 1rem; margin-top: 10px; flex-shrink: 0;
        }
        .btn-primary:hover:not(:disabled) { background: #3b6bcf; }
        .btn-primary:disabled { background: #222; color: #555; cursor: not-allowed; }
        
        .btn-secondary {
            background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px;
            color: #ccc; font-size: 0.7rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-secondary:hover { background: #222; color: white; border-color: #444; }

        #file-info { font-size: 0.8rem; color: #3b82f6; font-weight: bold; margin-bottom: 5px; flex-shrink: 0; }
        
        .flex-row { display: flex; gap: 10px; align-items: center; width: 100%;}
        .flex-col { display: flex; flex-direction: column; flex: 1; }
        .label-with-btn { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .label-with-btn label { margin-top: 0; }

        .mode-switcher {
            display: flex; position: relative; background: var(--input-bg); 
            border: 1px solid var(--border); border-radius: 12px; padding: 4px;
            margin-bottom: 5px; flex-shrink: 0;
        }
        .mode-btn {
            flex: 1; text-align: center; padding: 10px; font-weight: bold; font-size: 0.85rem;
            color: #888; cursor: pointer; z-index: 2; transition: color 0.3s;
        }
        .mode-btn.active { color: white; }
        .mode-slider {
            position: absolute; top: 4px; left: 4px; bottom: 4px; width: calc(50% - 4px);
            background: var(--accent); border-radius: 8px; z-index: 1;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .mode-switcher[data-mode="image"] .mode-slider { transform: translateX(100%); }
    </style>
</head>
<body>

<div class="container">
    <div class="preview-area" id="drop-zone">
        <canvas id="pdf-canvas"></canvas>
        <div id="file-prompt" style="position:absolute; color:#555; z-index:0; font-weight: bold; letter-spacing: 1px;">PDF REINZIEHEN ODER KLICKEN</div>
        <input type="file" id="pdf-upload" hidden accept="application/pdf">
    </div>

    <div class="controls">
        <h2 style="margin-top: 0; margin-bottom: 5px; flex-shrink: 0;">The Watermarker</h2>
        
        <div class="mode-switcher" id="mode-switcher" data-mode="pdf">
            <div class="mode-slider"></div>
            <div class="mode-btn active" id="btn-pdf" onclick="switchMode('pdf')">PDF Modus</div>
            <div class="mode-btn" id="btn-image" onclick="switchMode('image')">Bild Modus</div>
        </div>

        <div id="file-info">Status: Warten auf Datei...</div>

        <div class="accordion" id="acc-sidebar">
            <div class="accordion-header" onclick="toggleAcc('acc-sidebar')">
                <div class="checkbox-container" onclick="event.stopPropagation();">
                    <input type="checkbox" id="enable-sidebar" onchange="renderPreview()">
                    <label for="enable-sidebar" style="font-weight: bold; text-transform: uppercase;">Sidebar / Balken</label>
                </div>
                <span class="accordion-arrow">▼</span>
            </div>
            <div class="accordion-content">
                <label>Position</label>
                <select id="bar-pos">
                    <option value="left">Links</option>
                    <option value="right">Rechts</option>
                </select>

                <label>Breite (%) & Weicher Fade (%)</label>
                <div class="flex-row">
                    <input type="range" id="bar-w" min="1" max="50" value="8" title="Breite der harten Farbe">
                    <input type="range" id="bar-fade" min="0" max="100" value="2" title="Breite des weichen Übergangs">
                </div>

                <label>Farbe & Basis-Deckkraft</label>
                <div class="flex-row">
                    <input type="color" id="bar-c" value="#2952A3" style="flex:0.3;">
                    <input type="range" id="bar-o" min="0" max="1" step="0.05" value="1" style="flex:1;">
                </div>
                <div class="swatch-container">
                    <div class="swatch" style="background: #5475B5;" onclick="setBarColor('#5475B5')"></div>
                    <div class="swatch" style="background: #2952A3;" onclick="setBarColor('#2952A3')"></div>
                    <div class="swatch" style="background: #1A3568;" onclick="setBarColor('#1A3568')"></div>
                </div>
            </div>
        </div>

        <div class="accordion open" id="acc-text">
            <div class="accordion-header" onclick="toggleAcc('acc-text')">
                <span>Text Wasserzeichen</span>
                <span class="accordion-arrow">▼</span>
            </div>
            <div class="accordion-content">
                <label>Text Inhalt</label>
                <input type="text" id="side-t" value="WATERMARK">

                <div class="flex-row">
                    <div class="flex-col">
                        <label>Farbe</label>
                        <input type="color" id="text-c" value="#FFFFFF">
                    </div>
                    <div class="flex-col">
                        <label>Deckkraft</label>
                        <input type="range" id="text-o" min="0" max="1" step="0.05" value="0.5">
                    </div>
                </div>

                <div class="checkbox-container" style="margin-top: 10px; margin-bottom: 5px; background: #222; padding: 10px; border-radius: 8px;">
                    <input type="checkbox" id="text-grid" checked onchange="toggleGridSettings(); renderPreview();">
                    <label for="text-grid" style="font-weight: bold;">Als Crossgrid-Muster wiederholen</label>
                </div>

                <div id="grid-settings" style="display: block;">
                    <label>Muster-Abstand (%)</label>
                    <input type="range" id="text-grid-gap" min="1" max="100" value="15">
                </div>

                <div id="single-text-settings" style="display: none;">
                    <div class="label-with-btn">
                        <label>Position X (%) / Position Y (%)</label>
                        <button class="btn-secondary" onclick="centerElement('side-tx', 'side-ty')">ZENTRIEREN</button>
                    </div>
                    <div class="flex-row">
                        <input type="range" id="side-tx" min="0" max="100" value="50">
                        <input type="range" id="side-ty" min="0" max="100" value="50">
                    </div>
                </div>

                <label>Größe (%) / Rotation (°)</label>
                <div class="flex-row">
                    <input type="range" id="side-ts" min="0.5" max="30" step="0.1" value="5">
                    <input type="range" id="side-tr" min="0" max="360" value="45">
                </div>
            </div>
        </div>

        <div class="accordion" id="acc-logo">
            <div class="accordion-header" onclick="toggleAcc('acc-logo')">
                <span>Logo / Bild</span>
                <span class="accordion-arrow">▼</span>
            </div>
            <div class="accordion-content">
                <input type="file" id="logo-upload" accept="image/*">

                <div class="label-with-btn">
                    <label>Position X (%) / Position Y (%)</label>
                    <button class="btn-secondary" onclick="centerElement('logo-tx', 'logo-ty')">ZENTRIEREN</button>
                </div>
                <div class="flex-row">
                    <input type="range" id="logo-tx" min="0" max="100" value="4">
                    <input type="range" id="logo-ty" min="0" max="100" value="90">
                </div>

                <label>Größe (%) / Rotation (°)</label>
                <div class="flex-row">
                    <input type="range" id="logo-s" min="1" max="150" value="50">
                    <input type="range" id="logo-r" min="0" max="360" value="0">
                </div>
            </div>
        </div>

        <div class="accordion" id="acc-export">
            <div class="accordion-header" onclick="toggleAcc('acc-export')">
                <span>Export Einstellungen</span>
                <span class="accordion-arrow">▼</span>
            </div>
            <div class="accordion-content">
                <label>Seiten ignorieren (Nur für PDFs, z.B. 1, 2)</label>
                <input type="text" id="skip-pages" placeholder="Beispiel: 1, 2" title="Lass leer, um auf alle Seiten anzuwenden.">
                <small style="color:#666; font-size:0.7rem;">Die genannten Seiten erhalten kein Wasserzeichen.</small>
            </div>
        </div>

        <button class="btn-primary" id="download-btn" disabled>DOKUMENT GENERIEREN</button>
    </div>
</div>

<script>
const { PDFDocument, rgb, degrees, StandardFonts } = PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

const canvas = document.getElementById('pdf-canvas');
const ctx = canvas.getContext('2d');
const pdfBackgroundCanvas = document.createElement('canvas');
const bgCtx = pdfBackgroundCanvas.getContext('2d');

let pdfBuffer, pdfPage, logoImg, fontBuffer, logoFile;
let isDocumentLoaded = false;
let currentMode = 'pdf'; 
let uploadedImageElement = null;
let originalFileName = ""; 

function switchMode(mode) {
    if (currentMode === mode) return; 
    
    currentMode = mode;
    const switcher = document.getElementById('mode-switcher');
    const uploadInput = document.getElementById('pdf-upload');
    const promptText = document.getElementById('file-prompt');
    const statusText = document.getElementById('file-info');
    const downloadBtn = document.getElementById('download-btn');
    
    switcher.setAttribute('data-mode', mode);
    document.getElementById('btn-pdf').classList.toggle('active', mode === 'pdf');
    document.getElementById('btn-image').classList.toggle('active', mode === 'image');
    
    isDocumentLoaded = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bgCtx.clearRect(0, 0, pdfBackgroundCanvas.width, pdfBackgroundCanvas.height);
    uploadInput.value = ""; 
    originalFileName = "";
    downloadBtn.disabled = true;
    promptText.style.display = "block";
    statusText.innerText = "Status: Warten auf Datei...";
    
    if (mode === 'pdf') {
        uploadInput.accept = "application/pdf";
        promptText.innerText = "PDF REINZIEHEN ODER KLICKEN";
        downloadBtn.innerText = "PDF GENERIEREN";
        document.getElementById('acc-export').style.display = 'block'; 
    } else {
        uploadInput.accept = "image/png, image/jpeg, image/webp";
        promptText.innerText = "BILD REINZIEHEN ODER KLICKEN";
        downloadBtn.innerText = "BILD GENERIEREN";
        document.getElementById('acc-export').style.display = 'none'; 
    }
}

function toggleAcc(id) {
    document.getElementById(id).classList.toggle('open');
}

function toggleGridSettings() {
    const isGrid = document.getElementById('text-grid').checked;
    document.getElementById('single-text-settings').style.display = isGrid ? 'none' : 'block';
    document.getElementById('grid-settings').style.display = isGrid ? 'block' : 'none';
}

function centerElement(idX, idY) {
    document.getElementById(idX).value = 50;
    document.getElementById(idY).value = 50;
    renderPreview();
}

// BULLETPROOF BUGFIX: Dateiname exakt am letzten Punkt trennen
function generateExportFilename(extension) {
    if (!originalFileName) return `watermarked_document.${extension}`;
    
    const lastDotIndex = originalFileName.lastIndexOf('.');
    
    // Falls ein Punkt da ist (und es nicht das allererste Zeichen wie bei .hiddenfiles ist)
    if (lastDotIndex > 0) {
        const nameWithoutExtension = originalFileName.substring(0, lastDotIndex);
        return `${nameWithoutExtension}_watermarked.${extension}`;
    }
    
    // Fallback, falls die Datei gar keine Endung hatte
    return `${originalFileName}_watermarked.${extension}`;
}

async function loadFont() {
    try {
        const res = await fetch('font/company-name-font-stone-age.ttf');
        if(res.ok) {
            fontBuffer = await res.arrayBuffer();
            const fontFace = new FontFace('CustomBrandFont', fontBuffer);
            await fontFace.load();
            document.fonts.add(fontFace);
        }
    } catch (e) { console.log("Standard Font Fallback"); }
}

function getConfig() {
    return {
        enableBar: document.getElementById('enable-sidebar').checked,
        barPos: document.getElementById('bar-pos').value,
        barW: document.getElementById('bar-w').value / 100,
        barFade: document.getElementById('bar-fade').value / 100,
        barC: document.getElementById('bar-c').value,
        barO: parseFloat(document.getElementById('bar-o').value),
        
        text: document.getElementById('side-t').value,
        textC: document.getElementById('text-c').value,
        textO: parseFloat(document.getElementById('text-o').value),
        textX: document.getElementById('side-tx').value / 100,
        textY: document.getElementById('side-ty').value / 100,
        textSize: document.getElementById('side-ts').value / 100,
        textRot: parseInt(document.getElementById('side-tr').value),
        
        textGrid: document.getElementById('text-grid').checked,
        gridGap: document.getElementById('text-grid-gap').value / 100,
        
        logoX: document.getElementById('logo-tx').value / 100,
        logoY: document.getElementById('logo-ty').value / 100,
        logoSize: document.getElementById('logo-s').value / 100,
        logoRot: parseInt(document.getElementById('logo-r').value),
        
        skipPages: document.getElementById('skip-pages').value.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n))
    };
}

function setBarColor(hex) {
    document.getElementById('bar-c').value = hex;
    renderPreview();
}

function hexToRgbaStr(hex, alpha) {
    const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function drawWatermarkOverlay(targetCtx, width, height, cfg) {
    if (cfg.enableBar) {
        const barWidth = width * cfg.barW;
        const fadeWidth = width * cfg.barFade;
        
        targetCtx.globalAlpha = cfg.barO;
        targetCtx.fillStyle = cfg.barC;
        
        if (cfg.barPos === 'left') {
            if (barWidth > 0) targetCtx.fillRect(0, 0, barWidth, height);
            targetCtx.globalAlpha = 1;
            if (fadeWidth > 0) {
                const grad = targetCtx.createLinearGradient(barWidth, 0, barWidth + fadeWidth, 0);
                grad.addColorStop(0, hexToRgbaStr(cfg.barC, cfg.barO)); 
                grad.addColorStop(1, hexToRgbaStr(cfg.barC, 0));        
                targetCtx.fillStyle = grad; targetCtx.fillRect(barWidth, 0, fadeWidth, height);
            }
        } else {
            const startX = width - barWidth;
            if (barWidth > 0) targetCtx.fillRect(startX, 0, barWidth, height);
            targetCtx.globalAlpha = 1;
            if (fadeWidth > 0) {
                const fadeStartX = startX - fadeWidth;
                const grad = targetCtx.createLinearGradient(fadeStartX, 0, startX, 0);
                grad.addColorStop(0, hexToRgbaStr(cfg.barC, 0)); 
                grad.addColorStop(1, hexToRgbaStr(cfg.barC, cfg.barO));        
                targetCtx.fillStyle = grad; targetCtx.fillRect(fadeStartX, 0, fadeWidth, height);
            }
        }
    }

    if (cfg.text.length > 0) {
        const fontSize = width * cfg.textSize;
        targetCtx.save();
        targetCtx.fillStyle = hexToRgbaStr(cfg.textC, cfg.textO);
        targetCtx.font = `bold ${fontSize}px ${fontBuffer ? 'CustomBrandFont' : 'sans-serif'}`;
        targetCtx.textAlign = "center"; targetCtx.textBaseline = "middle";
        
        if (cfg.textGrid) {
            targetCtx.translate(width / 2, height / 2);
            targetCtx.rotate(-cfg.textRot * Math.PI / 180);
            
            const tWidth = targetCtx.measureText(cfg.text).width;
            const gap = width * cfg.gridGap;
            const stepX = Math.max(tWidth + gap, 1);
            const stepY = Math.max(fontSize + gap, 1);
            const maxDist = Math.sqrt(width*width + height*height) + stepX;

            for(let ox = -maxDist; ox <= maxDist; ox += stepX) {
                for(let oy = -maxDist; oy <= maxDist; oy += stepY) {
                    targetCtx.fillText(cfg.text, ox, oy);
                }
            }
        } else {
            targetCtx.translate(width * cfg.textX, height * (1 - cfg.textY));
            targetCtx.rotate(-cfg.textRot * Math.PI / 180);
            targetCtx.fillText(cfg.text, 0, 0); 
        }
        targetCtx.restore();
    }

    if (logoImg) {
        const logoW = width * cfg.logoSize;
        const scale = logoW / logoImg.width;
        const logoH = logoImg.height * scale;
        
        targetCtx.save();
        targetCtx.translate(width * cfg.logoX, height * (1 - cfg.logoY));
        targetCtx.rotate(-cfg.logoRot * Math.PI / 180);
        targetCtx.drawImage(logoImg, -logoW/2, -logoH/2, logoW, logoH);
        targetCtx.restore();
    }
}

function renderPreview() {
    if (!isDocumentLoaded) return;
    const width = canvas.width, height = canvas.height;
    ctx.clearRect(0, 0, width, height); 
    ctx.drawImage(pdfBackgroundCanvas, 0, 0, width, height);
    const cfg = getConfig();
    drawWatermarkOverlay(ctx, width, height, cfg);
}

document.querySelectorAll("input, select").forEach(i => {
    if(i.id !== 'skip-pages' && i.id !== 'pdf-upload') i.addEventListener("input", renderPreview);
});

document.getElementById("pdf-upload").onchange = async e => {
    const file = e.target.files[0];
    if(!file) return;
    
    // Speichere den Originalnamen
    originalFileName = file.name;
    
    document.getElementById("file-info").innerText = "Lade Datei...";
    document.getElementById("download-btn").disabled = true;

    if (currentMode === 'image' && file.type === 'application/pdf') {
        alert("Bitte wechsle zuerst in den PDF Modus, um PDFs hochzuladen.");
        originalFileName = "";
        return;
    }
    if (currentMode === 'pdf' && file.type.startsWith('image/')) {
        alert("Bitte wechsle zuerst in den Bild Modus, um Bilder hochzuladen.");
        originalFileName = "";
        return;
    }

    if (currentMode === 'image') {
        uploadedImageElement = new Image();
        uploadedImageElement.src = URL.createObjectURL(file);
        
        uploadedImageElement.onload = () => {
            pdfBackgroundCanvas.width = uploadedImageElement.width;
            pdfBackgroundCanvas.height = uploadedImageElement.height;
            bgCtx.drawImage(uploadedImageElement, 0, 0);

            let previewWidth = uploadedImageElement.width;
            let previewHeight = uploadedImageElement.height;
            if (previewWidth > 1200) {
                const ratio = 1200 / previewWidth;
                previewWidth = 1200; previewHeight = previewHeight * ratio;
            }

            canvas.width = previewWidth; canvas.height = previewHeight;
            
            isDocumentLoaded = true;
            document.getElementById("download-btn").disabled = false;
            document.getElementById("file-info").innerText = `Bild: ${file.name}`;
            document.getElementById("file-prompt").style.display = "none";
            renderPreview();
        };

    } else if (currentMode === 'pdf') {
        pdfBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: pdfBuffer.slice(0)}).promise; 
        pdfPage = await pdf.getPage(1);
        
        const viewport = pdfPage.getViewport({ scale: 1.5 });
        pdfBackgroundCanvas.width = viewport.width; 
        pdfBackgroundCanvas.height = viewport.height;
        await pdfPage.render({ canvasContext: bgCtx, viewport }).promise;

        canvas.width = viewport.width; canvas.height = viewport.height;
        
        isDocumentLoaded = true;
        document.getElementById("download-btn").disabled = false;
        document.getElementById("file-info").innerText = `PDF: ${file.name}`;
        document.getElementById("file-prompt").style.display = "none";
        renderPreview();
    }
};

document.getElementById("logo-upload").onchange = e => {
    logoFile = e.target.files[0];
    if(!logoFile) return;
    logoImg = new Image();
    logoImg.src = URL.createObjectURL(logoFile);
    logoImg.onload = renderPreview;
};

async function generateSmoothGradientBuffer(hexColor, opacity, direction) {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = 512; tempCanvas.height = 1;  
    const tCtx = tempCanvas.getContext('2d');
    
    const grad = tCtx.createLinearGradient(0, 0, 512, 0);
    if (direction === 'right') {
        grad.addColorStop(0, hexToRgbaStr(hexColor, 0));
        grad.addColorStop(1, hexToRgbaStr(hexColor, opacity));
    } else {
        grad.addColorStop(0, hexToRgbaStr(hexColor, opacity));
        grad.addColorStop(1, hexToRgbaStr(hexColor, 0));
    }
    
    tCtx.fillStyle = grad; tCtx.fillRect(0, 0, 512, 1);
    
    const dataUrl = tempCanvas.toDataURL('image/png');
    const binaryString = window.atob(dataUrl.split(',')[1]);
    const bytes = new Uint8Array(binaryString.length);
    for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
    return bytes.buffer;
}

document.getElementById("download-btn").onclick = async () => {
    const btn = document.getElementById("download-btn");
    const originalText = btn.innerText;
    btn.innerText = "VERARBEITUNG LÄUFT..."; btn.disabled = true;

    const cfg = getConfig();

    if (currentMode === 'image') {
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = uploadedImageElement.width;
        exportCanvas.height = uploadedImageElement.height;
        const eCtx = exportCanvas.getContext('2d');

        eCtx.drawImage(uploadedImageElement, 0, 0);
        drawWatermarkOverlay(eCtx, exportCanvas.width, exportCanvas.height, cfg);

        const link = document.createElement("a");
        link.download = generateExportFilename("png");
        link.href = exportCanvas.toDataURL("image/png");
        link.click();

        btn.innerText = originalText; btn.disabled = false;
        return;
    }

    const pdfDoc = await PDFDocument.load(pdfBuffer.slice(0));
    pdfDoc.registerFontkit(fontkit);
    
    const font = fontBuffer ? await pdfDoc.embedFont(fontBuffer) : await pdfDoc.embedFont(StandardFonts.HelveticaBold);
    const pages = pdfDoc.getPages();
    const baseColorRgb = rgb(parseInt(cfg.barC.slice(1,3),16)/255, parseInt(cfg.barC.slice(3,5),16)/255, parseInt(cfg.barC.slice(5,7),16)/255);
    const textColorRgb = rgb(parseInt(cfg.textC.slice(1,3),16)/255, parseInt(cfg.textC.slice(3,5),16)/255, parseInt(cfg.textC.slice(5,7),16)/255);

    let embeddedGradient = null;
    if (cfg.enableBar && cfg.barFade > 0) {
        const gradBuffer = await generateSmoothGradientBuffer(cfg.barC, cfg.barO, cfg.barPos);
        embeddedGradient = await pdfDoc.embedPng(gradBuffer);
    }

    let embeddedLogo = null;
    if (logoFile) {
        const logoBytes = await logoFile.arrayBuffer();
        embeddedLogo = logoFile.type === 'image/png' ? await pdfDoc.embedPng(logoBytes) : await pdfDoc.embedJpg(logoBytes);
    }

    for (let i = 0; i < pages.length; i++) {
        const pageNumber = i + 1;
        if (cfg.skipPages.includes(pageNumber)) continue;

        const page = pages[i];
        const { width, height } = page.getSize();
        
        if (cfg.enableBar) {
            const barWidth = width * cfg.barW;
            const fadeWidth = width * cfg.barFade;

            if (cfg.barPos === 'left') {
                if (barWidth > 0) page.drawRectangle({ x: 0, y: 0, width: barWidth, height: height, color: baseColorRgb, opacity: cfg.barO });
                if (embeddedGradient && fadeWidth > 0) {
                    page.drawImage(embeddedGradient, { x: barWidth, y: 0, width: fadeWidth + 1, height: height });
                }
            } else {
                const startX = width - barWidth;
                if (barWidth > 0) page.drawRectangle({ x: startX, y: 0, width: barWidth, height: height, color: baseColorRgb, opacity: cfg.barO });
                if (embeddedGradient && fadeWidth > 0) {
                    page.drawImage(embeddedGradient, { x: startX - fadeWidth - 1, y: 0, width: fadeWidth + 1, height: height });
                }
            }
        }

        if (cfg.text.length > 0) {
            const fontSize = width * cfg.textSize;
            const textWidth = font.widthOfTextAtSize(cfg.text, fontSize);
            const textHeight = fontSize * 0.75; 
            const radText = cfg.textRot * Math.PI / 180;

            if (cfg.textGrid) {
                const gap = width * cfg.gridGap;
                const stepX = Math.max(textWidth + gap, 1);
                const stepY = Math.max(fontSize + gap, 1);
                const maxDist = Math.sqrt(width*width + height*height) + stepX;
                const cx = width / 2;
                const cy = height / 2;

                for(let ox = -maxDist; ox <= maxDist; ox += stepX) {
                    for(let oy = -maxDist; oy <= maxDist; oy += stepY) {
                        const pivotX = cx + ox * Math.cos(radText) + oy * Math.sin(radText);
                        const pivotY = cy + ox * Math.sin(radText) - oy * Math.cos(radText);

                        const textX = pivotX - (textWidth/2) * Math.cos(radText) + (textHeight/2) * Math.sin(radText);
                        const textY = pivotY - (textWidth/2) * Math.sin(radText) - (textHeight/2) * Math.cos(radText);

                        page.drawText(cfg.text, {
                            x: textX, y: textY, size: fontSize, font: font,
                            color: textColorRgb, opacity: cfg.textO, rotate: degrees(cfg.textRot)
                        });
                    }
                }
            } else {
                const pivotX = width * cfg.textX, pivotY = height * cfg.textY;
                const textX = pivotX - (textWidth/2) * Math.cos(radText) + (textHeight/2) * Math.sin(radText);
                const textY = pivotY - (textWidth/2) * Math.sin(radText) - (textHeight/2) * Math.cos(radText);

                page.drawText(cfg.text, {
                    x: textX, y: textY, size: fontSize, font: font,
                    color: textColorRgb, opacity: cfg.textO, rotate: degrees(cfg.textRot)
                });
            }
        }

        if (embeddedLogo) {
            const pivotX = width * cfg.logoX, pivotY = height * cfg.logoY;
            const logoW = width * cfg.logoSize;
            const dims = embeddedLogo.scale(logoW / embeddedLogo.width);
            const logoH = dims.height;
            const radLogo = cfg.logoRot * Math.PI / 180;

            const logoX = pivotX - (logoW/2) * Math.cos(radLogo) + (logoH/2) * Math.sin(radLogo);
            const logoY = pivotY - (logoW/2) * Math.sin(radLogo) - (logoH/2) * Math.cos(radLogo);

            page.drawImage(embeddedLogo, {
                x: logoX, y: logoY, width: logoW, height: logoH, rotate: degrees(cfg.logoRot)
            });
        }
        
        if (pages.length > 50 && i % 10 === 0) await new Promise(r => setTimeout(r, 1));
    }

    const blob = new Blob([await pdfDoc.save()], {type:"application/pdf"});
    const link = document.createElement("a");
    link.download = generateExportFilename("pdf");
    link.href = URL.createObjectURL(blob);
    link.click();
    
    btn.innerText = originalText; btn.disabled = false;
};

document.getElementById("drop-zone").onclick = (e) => {
    if(e.target.tagName !== 'INPUT') document.getElementById("pdf-upload").click();
};

loadFont();
</script>
