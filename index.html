<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

    <style>
        :root {
            --bg: #050505; --card: #0f0f0f; --accent: #2952A3;
            --text: #ececec; --border: #262626; --input-bg: #1a1a1a;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0;
        }
        .container {
            width: 1200px; display: grid; grid-template-columns: 1fr 420px;
            gap: 24px; background: var(--card); padding: 32px;
            border-radius: 28px; border: 1px solid var(--border);
        }
        .preview-area {
            background: #000; border-radius: 16px; min-height: 700px;
            border: 1px solid var(--border); display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            position: relative; overflow: hidden;
        }
        canvas { max-width: 100%; max-height: 100%; z-index: 1; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .controls { display: flex; flex-direction: column; gap: 14px; max-height: 800px; overflow-y: auto; padding-right: 10px; }
        .controls::-webkit-scrollbar { width: 5px; }
        .controls::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        
        label { font-size: 0.75rem; color: #888; margin-top: 5px; font-weight: bold; text-transform: uppercase;}
        input { background: var(--input-bg); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 8px; }
        
        .swatch-container { display: flex; gap: 10px; margin-top: 5px; }
        .swatch { width: 35px; height: 35px; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .swatch:hover { border-color: white; transform: scale(1.1); }

        .btn-primary {
            background: #2952A3; border: none; padding: 16px; border-radius: 14px;
            color: white; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.2s;
        }
        .btn-primary:hover:not(:disabled) { background: #3b6bcf; }
        .btn-primary:disabled { background: #222; color: #555; cursor: not-allowed; }
        #file-info { font-size: 0.75rem; color: #3b82f6; font-weight: bold; margin-bottom: 5px; }
        .divider { height: 1px; background: var(--border); margin: 5px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="preview-area" id="drop-zone">
        <canvas id="pdf-canvas"></canvas>
        <div id="file-prompt" style="position:absolute; color:#555; z-index:0; font-weight: bold; letter-spacing: 1px;">PDF REINZIEHEN ODER KLICKEN</div>
        <input type="file" id="pdf-upload" hidden accept="application/pdf">
    </div>

    <div class="controls">
        <h2>The Watermarker</h2>
        <div id="file-info"></div>
        <div class="divider"></div>

        <label>Sidebar Breite (%)</label>
        <input type="range" id="bar-w" min="1" max="25" value="8">

        <label>Sidebar Farbe & CI Swatches</label>
        <input type="color" id="bar-c" value="#2952A3">
        <div class="swatch-container">
            <div class="swatch" style="background: #5475B5;" onclick="setBarColor('#5475B5')"></div>
            <div class="swatch" style="background: #2952A3;" onclick="setBarColor('#2952A3')"></div>
            <div class="swatch" style="background: #1A3568;" onclick="setBarColor('#1A3568')"></div>
        </div>

        <label>Transparenz</label>
        <input type="range" id="bar-o" min="0" max="1" step="0.1" value="1">

        <label>Text</label>
        <input type="text" id="side-t" value="(C) COLDROCK.GAMES">

        <label>Text Größe (%)</label>
        <input type="range" id="side-ts" min="0.5" max="5" step="0.1" value="1.5">

        <label>Text Rotation (°)</label>
        <input type="range" id="side-tr" min="0" max="360" value="90">

        <label>Text Y Position (%)</label>
        <input type="range" id="side-ty" min="0" max="100" value="20">

        <div class="divider"></div>

        <label>Logo Upload</label>
        <input type="file" id="logo-upload" accept="image/*">

        <label>Logo Größe (%)</label>
        <input type="range" id="logo-s" min="5" max="150" value="50">

        <label>Logo Rotation (°)</label>
        <input type="range" id="logo-r" min="0" max="360" value="0">

        <label>Logo Y Position (%)</label>
        <input type="range" id="logo-y" min="0" max="100" value="90">

        <button class="btn-primary" id="download-btn" disabled>PDF GENERIEREN</button>
    </div>
</div>

<script>
const { PDFDocument, rgb, degrees, StandardFonts } = PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

const canvas = document.getElementById('pdf-canvas');
const ctx = canvas.getContext('2d');

let pdfBuffer, pdfPage, logoImg, fontBuffer, logoFile;

async function loadFont() {
    try {
        const fontUrl = 'font/company-name-font-stone-age.ttf';
        const res = await fetch(fontUrl);
        if(res.ok) {
            fontBuffer = await res.arrayBuffer();
            const fontFace = new FontFace('CustomBrandFont', fontBuffer);
            await fontFace.load();
            document.fonts.add(fontFace);
            console.log("PRO-Log: Custom Font geladen");
        }
    } catch (e) { console.log("PRO-Log: Standard Font Fallback aktiv"); }
}

function getConfig() {
    return {
        barW: document.getElementById('bar-w').value / 100,
        barC: document.getElementById('bar-c').value,
        barO: parseFloat(document.getElementById('bar-o').value),
        text: document.getElementById('side-t').value,
        textSize: document.getElementById('side-ts').value / 100,
        textRot: parseInt(document.getElementById('side-tr').value),
        textY: document.getElementById('side-ty').value / 100,
        logoSize: document.getElementById('logo-s').value / 100,
        logoRot: parseInt(document.getElementById('logo-r').value),
        logoY: document.getElementById('logo-y').value / 100
    };
}

function setBarColor(hex) {
    document.getElementById('bar-c').value = hex;
    renderPreview();
}

async function renderPreview() {
    if (!pdfPage) return;

    const viewport = pdfPage.getViewport({ scale: 1.5 });
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await pdfPage.render({ canvasContext: ctx, viewport }).promise;

    const cfg = getConfig();
    const width = canvas.width;
    const height = canvas.height;
    const barWidth = width * cfg.barW;
    const centerX = barWidth / 2;

    ctx.globalAlpha = cfg.barO;
    ctx.fillStyle = cfg.barC;
    ctx.fillRect(0, 0, barWidth, height);
    ctx.globalAlpha = 1;

    const fontSize = width * cfg.textSize;
    const textY_Canvas = height * (1 - cfg.textY); 

    ctx.save();
    ctx.translate(centerX, textY_Canvas);
    ctx.rotate(-cfg.textRot * Math.PI / 180);
    ctx.fillStyle = "white";
    ctx.font = `bold ${fontSize}px ${fontBuffer ? 'CustomBrandFont' : 'sans-serif'}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(cfg.text, 0, 0); 
    ctx.restore();

    if (logoImg) {
        const logoW = barWidth * cfg.logoSize;
        const scale = logoW / logoImg.width;
        const logoH = logoImg.height * scale;
        const logoY_Canvas = height * (1 - cfg.logoY);

        ctx.save();
        ctx.translate(centerX, logoY_Canvas);
        ctx.rotate(-cfg.logoRot * Math.PI / 180);
        ctx.drawImage(logoImg, -logoW/2, -logoH/2, logoW, logoH);
        ctx.restore();
    }
}

document.querySelectorAll("input").forEach(i => i.addEventListener("input", renderPreview));

document.getElementById("pdf-upload").onchange = async e => {
    const file = e.target.files[0];
    if(!file) return;
    pdfBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: pdfBuffer.slice(0)}).promise; 
    pdfPage = await pdf.getPage(1);
    document.getElementById("download-btn").disabled = false;
    document.getElementById("file-info").innerText = `Dokument: ${file.name}`;
    document.getElementById("file-prompt").style.display = "none";
    renderPreview();
};

document.getElementById("logo-upload").onchange = e => {
    logoFile = e.target.files[0];
    if(!logoFile) return;
    logoImg = new Image();
    logoImg.src = URL.createObjectURL(logoFile);
    logoImg.onload = renderPreview;
};

// =========================================================================
// MATHEMATISCH KORREKTER PDF-EXPORT (IDENTISCH ZUR VORSCHAU)
// =========================================================================
document.getElementById("download-btn").onclick = async () => {
    const btn = document.getElementById("download-btn");
    btn.innerText = "VERARBEITUNG LÄUFT...";
    btn.disabled = true;

    const pdfDoc = await PDFDocument.load(pdfBuffer.slice(0));
    pdfDoc.registerFontkit(fontkit);
    
    const font = fontBuffer ? await pdfDoc.embedFont(fontBuffer) : await pdfDoc.embedFont(StandardFonts.HelveticaBold);
    const pages = pdfDoc.getPages();
    const cfg = getConfig();

    let embeddedLogo = null;
    if (logoFile) {
        const logoBytes = await logoFile.arrayBuffer();
        embeddedLogo = logoFile.type === 'image/png' ? await pdfDoc.embedPng(logoBytes) : await pdfDoc.embedJpg(logoBytes);
    }

    for (const page of pages) {
        const { width, height } = page.getSize();
        const barWidth = width * cfg.barW;
        
        const centerX = barWidth / 2;
        const cyText = height * cfg.textY; 
        const cyLogo = height * cfg.logoY;

        page.drawRectangle({
            x: 0, y: 0, width: barWidth, height: height,
            color: hexToRgb(cfg.barC), opacity: cfg.barO
        });

        const fontSize = width * cfg.textSize;
        const textWidth = font.widthOfTextAtSize(cfg.text, fontSize);
        const textHeight = fontSize * 0.75; 
        const radText = cfg.textRot * Math.PI / 180;

        const textX = centerX - (textWidth/2) * Math.cos(radText) + (textHeight/2) * Math.sin(radText);
        const textY = cyText - (textWidth/2) * Math.sin(radText) - (textHeight/2) * Math.cos(radText);

        page.drawText(cfg.text, {
            x: textX,
            y: textY,
            size: fontSize,
            font: font,
            color: rgb(1,1,1),
            rotate: degrees(cfg.textRot)
        });

        if (embeddedLogo) {
            const logoW = barWidth * cfg.logoSize;
            const dims = embeddedLogo.scale(logoW / embeddedLogo.width);
            const logoH = dims.height;
            const radLogo = cfg.logoRot * Math.PI / 180;

            const logoX = centerX - (logoW/2) * Math.cos(radLogo) + (logoH/2) * Math.sin(radLogo);
            const logoY = cyLogo - (logoW/2) * Math.sin(radLogo) - (logoH/2) * Math.cos(radLogo);

            page.drawImage(embeddedLogo, {
                x: logoX,
                y: logoY,
                width: logoW, height: logoH,
                rotate: degrees(cfg.logoRot)
            });
        }
        
        if (pages.length > 50) await new Promise(r => setTimeout(r, 1));
    }

    const blob = new Blob([await pdfDoc.save()], {type:"application/pdf"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "branded_coldrock_final.pdf";
    link.click();
    
    btn.innerText = "PDF GENERIEREN";
    btn.disabled = false;
};

function hexToRgb(hex){
    return rgb(
        parseInt(hex.slice(1,3),16)/255,
        parseInt(hex.slice(3,5),16)/255,
        parseInt(hex.slice(5,7),16)/255
    );
}

document.getElementById("drop-zone").onclick = (e) => {
    if(e.target.tagName !== 'INPUT') document.getElementById("pdf-upload").click();
};

loadFont();
</script>
</body>
</html>
